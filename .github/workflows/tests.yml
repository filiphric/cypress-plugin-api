name: e2e-tests
on: [push]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # semantic-release pushes tags / GitHub release
      id-token: write        # required for npm trusted publishing (OIDC)
      issues: write          # semantic-release comments on released issues
      pull-requests: write   # semantic-release comments on released PRs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest   # needs >= 11.5.1
      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          start: npm start
          build: npm run build
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          branch: main
          semantic_version: ^25.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN removed — OIDC trusted publishing handles auth